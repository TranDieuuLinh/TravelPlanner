<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="2600" viewBox="0 0 2200 2600">
  <title>VSF Travel Knowledge Graph schema version 7</title>
  <desc>Final overview of seven SQL tables, node hierarchy and counts, edge contracts and counts, and concrete examples.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#475569"/>
    </marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#2563eb"/>
    </marker>
    <style>
      text { font-family: "DejaVu Sans", Arial, sans-serif; fill: #172033; }
      .title { font-size: 48px; font-weight: 700; }
      .subtitle { font-size: 22px; fill: #526076; }
      .section { font-size: 28px; font-weight: 700; }
      .heading { font-size: 20px; font-weight: 700; }
      .body { font-size: 17px; }
      .small { font-size: 14px; fill: #526076; }
      .tiny { font-size: 12px; fill: #526076; }
      .count { font-size: 28px; font-weight: 700; }
      .panel { fill: #ffffff; stroke: #d7dee9; stroke-width: 2; }
      .metric { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .abstract { fill: #eef2ff; stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 6; }
      .place { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .area { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .activity { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .item { fill: #f3e8ff; stroke: #9333ea; stroke-width: 2; }
      .import { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; }
      .note { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
      .line { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .bi { fill: none; stroke: #64748b; stroke-width: 2.5; marker-start: url(#arrow); marker-end: url(#arrow); }
      .tree { fill: none; stroke: #94a3b8; stroke-width: 2; }
      .example-line { fill: none; stroke: #2563eb; stroke-width: 4; marker-end: url(#blue-arrow); }
      .pill { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .divider { stroke: #d7dee9; stroke-width: 2; }
    </style>
  </defs>

  <rect width="2200" height="2600" fill="#f7f9fc"/>
  <text x="70" y="72" class="title">VSF Travel Knowledge Graph — bản final</text>
  <text x="70" y="112" class="subtitle">Schema version 7 · dữ liệu từ kg_dump_v7.sql · kiểm tra orphan, duplicate và edge contract đều bằng 0</text>

  <!-- Summary -->
  <g transform="translate(70 145)">
    <rect width="480" height="120" rx="18" class="metric"/>
    <text x="28" y="38" class="small">SQL TABLES</text><text x="28" y="82" class="count">7 bảng</text>
    <text x="28" y="105" class="small">4 graph core + 3 import/review</text>
  </g>
  <g transform="translate(590 145)">
    <rect width="480" height="120" rx="18" class="metric"/>
    <text x="28" y="38" class="small">PERSISTED NODES</text><text x="28" y="82" class="count">32.358 node</text>
    <text x="28" y="105" class="small">9 concrete types · 4 abstract types</text>
  </g>
  <g transform="translate(1110 145)">
    <rect width="480" height="120" rx="18" class="metric"/>
    <text x="28" y="38" class="small">RELATIONSHIPS</text><text x="28" y="82" class="count">62.871 edge</text>
    <text x="28" y="105" class="small">8 edge types trong ontology</text>
  </g>
  <g transform="translate(1630 145)">
    <rect width="500" height="120" rx="18" class="metric"/>
    <text x="28" y="38" class="small">PROPERTY CONTRACT</text><text x="28" y="82" class="count">337.767 property</text>
    <text x="28" y="105" class="small">entity_id · key · value · source · note</text>
  </g>

  <!-- SQL tables -->
  <rect x="55" y="300" width="2090" height="500" rx="22" class="panel"/>
  <text x="85" y="348" class="section">1. Bảy bảng SQL và cách chúng nối với nhau</text>
  <text x="85" y="378" class="small">Graph core lưu dữ liệu đã duyệt; import/review giữ proposal trước khi apply.</text>

  <rect x="720" y="410" width="430" height="165" rx="16" class="place"/>
  <text x="745" y="445" class="heading">knowledge_entities</text>
  <text x="745" y="477" class="body">id · canonical_name · normalized_name</text>
  <text x="745" y="507" class="body">entity_type · status</text>
  <text x="745" y="537" class="body">created_at · updated_at</text>
  <text x="1115" y="550" text-anchor="end" class="small">NODE</text>

  <rect x="100" y="445" width="470" height="190" rx="16" class="note"/>
  <text x="125" y="480" class="heading">knowledge_properties</text>
  <text x="125" y="512" class="body">id · entity_id · key · value</text>
  <text x="125" y="542" class="body">source · note · updated_at</text>
  <rect x="118" y="562" width="420" height="48" rx="10" fill="#ffedd5"/>
  <text x="138" y="592" class="body">note = ghi chú; không thay thế source</text>

  <rect x="100" y="660" width="470" height="105" rx="16" class="import"/>
  <text x="125" y="697" class="heading">knowledge_aliases</text>
  <text x="125" y="730" class="body">entity_id · alias · normalized_alias · language</text>

  <rect x="720" y="620" width="430" height="145" rx="16" class="activity"/>
  <text x="745" y="657" class="heading">knowledge_relationships</text>
  <text x="745" y="689" class="body">from_entity_id · relationship_type</text>
  <text x="745" y="719" class="body">to_entity_id · recommendations · source</text>
  <text x="1115" y="748" text-anchor="end" class="small">EDGE</text>

  <path d="M720 482 H585" class="line"/>
  <text x="612" y="468" class="small">1 → N properties</text>
  <path d="M720 535 H610 V712 H585" class="line"/>
  <text x="615" y="698" class="small">1 → N aliases</text>
  <path d="M935 575 V608" class="line"/>
  <text x="950" y="600" class="small">from / to</text>

  <rect x="1270" y="410" width="780" height="355" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1300" y="448" class="heading">Admin import &amp; review</text>
  <rect x="1310" y="480" width="285" height="92" rx="14" class="import"/>
  <text x="1452" y="515" text-anchor="middle" class="heading">knowledge_graph_imports</text>
  <text x="1452" y="545" text-anchor="middle" class="small">phiên import · status · version</text>
  <rect x="1725" y="470" width="285" height="105" rx="14" class="import"/>
  <text x="1867" y="498" text-anchor="middle" class="body">knowledge_graph_import_nodes</text>
  <text x="1867" y="530" text-anchor="middle" class="small">node proposal · confidence</text>
  <text x="1867" y="553" text-anchor="middle" class="small">match · decision · evidence</text>
  <rect x="1725" y="625" width="285" height="105" rx="14" class="import"/>
  <text x="1867" y="653" text-anchor="middle" class="body">knowledge_graph_import_edges</text>
  <text x="1867" y="685" text-anchor="middle" class="small">edge proposal · confidence</text>
  <text x="1867" y="708" text-anchor="middle" class="small">decision · evidence</text>
  <path d="M1595 526 H1710" class="line"/>
  <path d="M1595 540 H1645 V677 H1710" class="line"/>
  <text x="1340" y="620" class="body">Admin duyệt proposal</text>
  <path d="M1450 637 V700 H1205" class="line"/>
  <text x="1275" y="690" class="small">apply → graph core</text>

  <!-- Node taxonomy -->
  <rect x="55" y="830" width="2090" height="440" rx="22" class="panel"/>
  <text x="85" y="878" class="section">2. Node taxonomy và số lượng hiện có</text>
  <text x="85" y="908" class="small">Nét đứt là abstract — chỉ dùng để kế thừa và validate, không lưu thành node.</text>

  <rect x="930" y="930" width="250" height="55" rx="13" class="abstract"/>
  <text x="1055" y="965" text-anchor="middle" class="heading">Entity</text>
  <path d="M1055 985 V1008 H405 V1030 M1055 1008 V1030 M1055 1008 H1700 V1030" class="tree"/>
  <rect x="275" y="1030" width="260" height="55" rx="13" class="abstract"/>
  <text x="405" y="1065" text-anchor="middle" class="heading">LocationEntity</text>
  <rect x="930" y="1030" width="250" height="55" rx="13" class="activity"/>
  <text x="1055" y="1055" text-anchor="middle" class="heading">Activity · 43</text>
  <text x="1055" y="1077" text-anchor="middle" class="small">16 cũ + 27 special cụ thể</text>
  <rect x="1580" y="1030" width="240" height="55" rx="13" class="abstract"/>
  <text x="1700" y="1065" text-anchor="middle" class="heading">Item</text>

  <path d="M405 1085 V1105 H270 V1125 M405 1105 H550 V1125" class="tree"/>
  <rect x="145" y="1125" width="250" height="55" rx="13" class="abstract"/>
  <text x="270" y="1160" text-anchor="middle" class="heading">Place</text>
  <rect x="430" y="1125" width="240" height="55" rx="13" class="area"/>
  <text x="550" y="1160" text-anchor="middle" class="heading">Area · 50</text>
  <path d="M270 1180 V1200 H115 M270 1200 H735" class="tree"/>
  <rect x="65" y="1200" width="205" height="48" rx="11" class="place"/><text x="167" y="1231" text-anchor="middle" class="body">TravelPlace · 14.502</text>
  <rect x="290" y="1200" width="205" height="48" rx="11" class="place"/><text x="392" y="1231" text-anchor="middle" class="body">Restaurant · 9.917</text>
  <rect x="515" y="1200" width="205" height="48" rx="11" class="place"/><text x="617" y="1231" text-anchor="middle" class="body">DrinkDessert · 6.987</text>
  <rect x="740" y="1200" width="210" height="48" rx="11" class="place"/><text x="845" y="1231" text-anchor="middle" class="body">Accommodation · 853</text>

  <path d="M1700 1085 V1115 H1450 V1140 M1700 1115 V1140 M1700 1115 H1950 V1140" class="tree"/>
  <rect x="1340" y="1140" width="220" height="55" rx="12" class="item"/><text x="1450" y="1175" text-anchor="middle" class="heading">FoodItem · 3</text>
  <rect x="1590" y="1140" width="220" height="55" rx="12" class="item"/><text x="1700" y="1175" text-anchor="middle" class="heading">DrinkItem · 3</text>
  <rect x="1840" y="1140" width="220" height="55" rx="12" class="item"/><text x="1950" y="1165" text-anchor="middle" class="heading">ProductItem · 0</text><text x="1950" y="1188" text-anchor="middle" class="small">chưa có nguồn</text>

  <!-- Edge table -->
  <rect x="55" y="1300" width="2090" height="650" rx="22" class="panel"/>
  <text x="85" y="1348" class="section">3. Edge contract, số lượng và ví dụ</text>
  <text x="85" y="1380" class="small">Mọi ví dụ thể hiện đúng hướng from → to. ADJACENT_TO là quan hệ hai chiều.</text>

  <text x="100" y="1420" class="small">FROM</text><text x="400" y="1420" class="small">EDGE</text><text x="850" y="1420" class="small">COUNT</text><text x="1010" y="1420" class="small">TO</text><text x="1370" y="1420" class="small">VÍ DỤ DỄ HIỂU</text>
  <line x1="85" y1="1435" x2="2115" y2="1435" class="divider"/>

  <g transform="translate(90 1450)"><rect width="235" height="50" rx="11" class="place"/><text x="117" y="32" text-anchor="middle" class="body">Place</text><text x="300" y="32" class="heading">LOCATED_IN</text><text x="780" y="32" class="heading">32.259</text><rect x="900" width="280" height="50" rx="11" class="abstract"/><text x="1040" y="32" text-anchor="middle" class="body">LocationEntity</text><text x="1280" y="32" class="body">Tháp Rùa → Hồ Gươm</text></g>
  <g transform="translate(90 1515)"><rect width="235" height="50" rx="11" class="area"/><text x="117" y="32" text-anchor="middle" class="body">Area</text><text x="300" y="32" class="heading">ADJACENT_TO ↔</text><text x="780" y="32" class="heading">0</text><rect x="900" width="280" height="50" rx="11" class="area"/><text x="1040" y="32" text-anchor="middle" class="body">Area</text><text x="1280" y="24" class="body">Hoàn Kiếm ↔ Hai Bà Trưng</text><text x="1280" y="45" class="small">chưa có nguồn boundary trong SQL</text></g>
  <g transform="translate(90 1580)"><rect width="235" height="50" rx="11" class="area"/><text x="117" y="32" text-anchor="middle" class="body">Area con</text><text x="300" y="32" class="heading">PART_OF</text><text x="780" y="32" class="heading">49</text><rect x="900" width="280" height="50" rx="11" class="area"/><text x="1040" y="32" text-anchor="middle" class="body">Area cha</text><text x="1280" y="32" class="body">Trúc Bạch → Ba Đình</text></g>
  <g transform="translate(90 1645)"><rect width="235" height="50" rx="11" class="place"/><text x="117" y="32" text-anchor="middle" class="body">Place</text><text x="300" y="32" class="heading">OFFERS_ACTIVITY</text><text x="780" y="32" class="heading">23.983</text><rect x="900" width="280" height="50" rx="11" class="activity"/><text x="1040" y="32" text-anchor="middle" class="body">Activity</text><text x="1280" y="32" class="body">Nhà hát múa rối → Xem múa rối nước</text></g>
  <g transform="translate(90 1710)"><rect width="235" height="50" rx="11" class="abstract"/><text x="117" y="32" text-anchor="middle" class="body">LocationEntity</text><text x="300" y="32" class="heading">SPECIAL_EXPERIENCE</text><text x="780" y="32" class="heading">54</text><rect x="900" width="280" height="50" rx="11" class="activity"/><text x="1040" y="32" text-anchor="middle" class="body">Activity</text><text x="1280" y="24" class="body">Hồ Gươm → Đi dạo</text><text x="1280" y="45" class="small">priority: optional | recommended | must</text></g>
  <g transform="translate(90 1775)"><rect width="235" height="50" rx="11" class="place"/><text x="117" y="32" text-anchor="middle" class="body">Place</text><text x="300" y="32" class="heading">OFFERS_ITEM</text><text x="780" y="32" class="heading">6.493</text><rect x="900" width="280" height="50" rx="11" class="item"/><text x="1040" y="32" text-anchor="middle" class="body">Item</text><text x="1280" y="32" class="body">Quán Phở → Phở bò</text></g>
  <g transform="translate(90 1840)"><rect width="235" height="50" rx="11" class="activity"/><text x="117" y="32" text-anchor="middle" class="body">Activity</text><text x="300" y="32" class="heading">INVOLVES_ITEM</text><text x="780" y="32" class="heading">6</text><rect x="900" width="280" height="50" rx="11" class="item"/><text x="1040" y="32" text-anchor="middle" class="body">Item</text><text x="1280" y="32" class="body">Ăn phở → Phở</text></g>
  <g transform="translate(90 1905)"><rect width="235" height="50" rx="11" class="activity"/><text x="117" y="32" text-anchor="middle" class="body">Activity</text><text x="300" y="32" class="heading">TARGETS_PLACE</text><text x="780" y="32" class="heading">27</text><rect x="900" width="280" height="50" rx="11" class="place"/><text x="1040" y="32" text-anchor="middle" class="body">Place</text><text x="1280" y="32" class="body">Dạo Hồ Hoàn Kiếm → Hồ Gươm</text></g>

  <!-- Detailed examples -->
  <rect x="55" y="1980" width="2090" height="545" rx="22" class="panel"/>
  <text x="85" y="2028" class="section">4. Ba chuỗi ví dụ hoàn chỉnh</text>

  <text x="90" y="2080" class="heading">A. Không gian</text>
  <rect x="90" y="2100" width="300" height="72" rx="15" class="place"/><text x="240" y="2133" text-anchor="middle" class="heading">Tháp Rùa</text><text x="240" y="2158" text-anchor="middle" class="small">TravelPlace</text>
  <path d="M390 2136 H670" class="example-line"/><rect x="430" y="2107" width="200" height="34" rx="16" class="pill"/><text x="530" y="2130" text-anchor="middle" class="small">LOCATED_IN</text>
  <rect x="685" y="2100" width="300" height="72" rx="15" class="place"/><text x="835" y="2133" text-anchor="middle" class="heading">Hồ Gươm</text><text x="835" y="2158" text-anchor="middle" class="small">TravelPlace</text>
  <text x="1040" y="2127" class="body">Một Place có thể nằm trong Place khác.</text><text x="1040" y="2155" class="small">Không bắt buộc đích phải là Area.</text>

  <line x1="85" y1="2200" x2="2115" y2="2200" class="divider"/>
  <text x="90" y="2245" class="heading">B. Special experience</text>
  <rect x="90" y="2265" width="300" height="72" rx="15" class="area"/><text x="240" y="2298" text-anchor="middle" class="heading">Đà Lạt</text><text x="240" y="2323" text-anchor="middle" class="small">Area</text>
  <path d="M390 2301 H760" class="example-line"/><rect x="430" y="2272" width="285" height="34" rx="16" class="pill"/><text x="572" y="2295" text-anchor="middle" class="small">SPECIAL_EXPERIENCE</text>
  <rect x="775" y="2265" width="300" height="72" rx="15" class="activity"/><text x="925" y="2298" text-anchor="middle" class="heading">Săn mây</text><text x="925" y="2323" text-anchor="middle" class="small">Activity</text>
  <rect x="1140" y="2248" width="920" height="105" rx="15" class="note"/>
  <text x="1170" y="2280" class="body">recommendations: priority = must · timeSlots = sáng sớm</text>
  <text x="1170" y="2310" class="body">reason = trải nghiệm đặc trưng · source = nguồn kiểm chứng</text>
  <text x="1170" y="2338" class="small">Gợi ý thường dùng recommended; trải nghiệm bắt buộc dùng must.</text>

  <line x1="85" y1="2380" x2="2115" y2="2380" class="divider"/>
  <text x="90" y="2425" class="heading">C. Activity khác Item</text>
  <rect x="90" y="2445" width="270" height="65" rx="15" class="place"/><text x="225" y="2473" text-anchor="middle" class="heading">Quán Phở</text><text x="225" y="2497" text-anchor="middle" class="small">Restaurant</text>
  <path d="M360 2478 H650" class="example-line"/><rect x="385" y="2450" width="240" height="34" rx="16" class="pill"/><text x="505" y="2473" text-anchor="middle" class="small">SPECIAL_EXPERIENCE</text>
  <rect x="665" y="2445" width="270" height="65" rx="15" class="activity"/><text x="800" y="2473" text-anchor="middle" class="heading">Ăn phở</text><text x="800" y="2497" text-anchor="middle" class="small">Activity = làm gì?</text>
  <path d="M935 2478 H1235" class="example-line"/><rect x="970" y="2450" width="230" height="34" rx="16" class="pill"/><text x="1085" y="2473" text-anchor="middle" class="small">INVOLVES_ITEM</text>
  <rect x="1250" y="2445" width="270" height="65" rx="15" class="item"/><text x="1385" y="2473" text-anchor="middle" class="heading">Phở</text><text x="1385" y="2497" text-anchor="middle" class="small">FoodItem = món gì?</text>
  <path d="M225 2510 V2550 H1385 V2510" class="example-line"/><rect x="680" y="2528" width="190" height="34" rx="16" class="pill"/><text x="775" y="2551" text-anchor="middle" class="small">OFFERS_ITEM</text>
  <text x="1580" y="2470" class="body">Tách action và item giúp Planner</text><text x="1580" y="2498" class="body">tìm đúng “làm gì” và “ăn/uống gì”.</text>

  <text x="1100" y="2580" text-anchor="middle" class="small">Graph core: entities + properties + aliases + relationships · Import tables chỉ phục vụ proposal và admin review</text>
</svg>
