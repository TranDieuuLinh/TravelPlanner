[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-planner-agents"
version = "0.1.0"
description = "A modular LangGraph travel-planning backend."
requires-python = ">=3.11"
dependencies = [
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langgraph>=1.2,<2",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "tavily-python>=0.7,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]
embeddings = [
  "sentence-transformers>=3,<6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/app/modules"]
pythonpath = ["src"]
