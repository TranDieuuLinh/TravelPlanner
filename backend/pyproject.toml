[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-planner-agents"
version = "0.1.0"
description = "A modular LangGraph travel-planning backend."
requires-python = ">=3.11"
dependencies = [
  "asyncpg>=0.30,<1",
  "curl-cffi>=0.15,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langchain-core>=0.3,<2",
  "langfuse>=4.14,<5",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-postgres>=2,<4",
  "ortools>=9.11,<10",
  "playwright==1.62.0",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "psycopg[binary]>=3.2,<4",
  "tavily-python>=0.7,<1",
  "trafilatura>=2,<3",
  "uvicorn[standard]>=0.30,<1",
  "yt-dlp[default,curl-cffi]>=2026.7.4,<2027",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/app/modules"]
pythonpath = ["src"]
