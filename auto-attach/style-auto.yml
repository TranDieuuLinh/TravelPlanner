rule_defaults:
  match_mode: normalized_name_or_alias
  case_sensitive: false
  accent_sensitive: false
  keyword_match: contains
  exclude_match: contains
  apply_global_exclusions_before_style_match: true
  auto_attach_status: pending
  source: attach_auto.yml
  require_manual_review_for:
    - exact_name_override
    - ambiguous_name
    - conflicting_style
    - low_match_confidence
