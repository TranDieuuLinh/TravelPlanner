# Auto-attach rules for connecting entities to Style nodes through Has_Style.
# Matching is performed against normalized canonical names and aliases.
# A match creates a pending candidate; manual review is reserved for ambiguous
# or exceptional names.

version: "0.1.0"
relationship: Has_Style

# Global exclusions are evaluated before every Style rule.
# They prevent generic service/office entities from receiving travel styles.
global_exclude_keywords:
  - "cơm văn phòng"
  - "trung tâm tư vấn"
  - "trung tâm khởi nghiệp"
  - "trung tâm hỗ trợ doanh nghiệp"
  - "trung tâm dịch vụ việc làm"
  - "trung tâm hành chính"
  - "trung tâm hành chính công"
  - "trung tâm nghiên cứu"
  - "trung tâm đào tạo"
  - "trung tâm giáo dục"
  - "trung tâm bảo trợ"
  - "trung tâm công tác xã hội"
  - "văn phòng đại diện"
  - "văn phòng giao dịch"
  - "phòng giao dịch"
  - "trụ sở"
  - "chi nhánh ngân hàng"
  - "cơ quan hành chính"
