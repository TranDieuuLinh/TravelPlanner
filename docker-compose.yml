name: TrungLinhLoi-Travel

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: ${LOCAL_POSTGRES_DB:-travelplanner}
      POSTGRES_USER: ${LOCAL_POSTGRES_USER:-travelplanner}
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-travelplanner_local}
    ports:
      - "${LOCAL_POSTGRES_PORT:-55432}:5432"
    volumes:
      - travelplanner-postgres18:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${LOCAL_POSTGRES_USER:-travelplanner} -d ${LOCAL_POSTGRES_DB:-travelplanner}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:?Set PIP_INDEX_URL in backend/.env}
    env_file:
      - path: ./backend/.env
        required: true
    ports:
      - "${BACKEND_PORT:?Set BACKEND_PORT in backend/.env}:8000"
    volumes:
      - ./backend:/app
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "/app/src",
      ]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valhalla:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    env_file:
      - path: ./backend/.env
        required: true
    ports:
      - "${VALHALLA_PORT:?Set VALHALLA_PORT in backend/.env}:8002"
    volumes:
      - ./routing-data/valhalla:/custom_files
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://localhost:8002/status",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  opentripplanner:
    image: docker.io/opentripplanner/opentripplanner:2.9.0
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        if [ ! -s /var/opentripplanner/graph.obj ]; then
          if find /var/opentripplanner -maxdepth 1 -type f -name '*.osm.pbf' -print -quit | grep -q . \
            && find /var/opentripplanner -maxdepth 1 -type f -iname '*gtfs*.zip' -print -quit | grep -q .; then
            echo "OTP graph.obj is missing; building it from the mounted OSM and GTFS inputs..."
            /docker-entrypoint.sh --build --save
          else
            echo "OTP data is not prepared; keeping the container alive. See routing-data/README.md."
            exec tail -f /dev/null
          fi
        fi
        exec /docker-entrypoint.sh --load --serve
    env_file:
      - path: ./backend/.env
        required: true
    ports:
      - "${OPENTRIPPLANNER_PORT:?Set OPENTRIPPLANNER_PORT in backend/.env}:8080"
    volumes:
      - ./routing-data/opentripplanner:/var/opentripplanner
    restart: unless-stopped

volumes:
  travelplanner-postgres18:
