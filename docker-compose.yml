services:
  postgres:
    # This workspace owns its database through the Compose project-scoped
    # travelplanner_postgres_data_v2 volume below.
    image: pgvector/pgvector:0.8.2-pg16
    environment:
      POSTGRES_DB: travelplanner
      POSTGRES_USER: travelplanner
      POSTGRES_PASSWORD: travelplanner
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    volumes:
      # Compose prefixes this volume with the current project name, so it is
      # independent from volumes created by other TravelPlanner workspaces.
      - travelplanner_postgres_data_v2:/var/lib/postgresql/data
      - ./backend/migrations/001_information_finder_source_cache.sql:/docker-entrypoint-initdb.d/001_information_finder_source_cache.sql:ro
      - ./backend/migrations/002_explorer_source_document_cache.sql:/docker-entrypoint-initdb.d/002_explorer_source_document_cache.sql:ro
      - ./backend/migrations/003_explorer_draft_cache.sql:/docker-entrypoint-initdb.d/003_explorer_draft_cache.sql:ro
      - ./backend/migrations/002_auth.sql:/docker-entrypoint-initdb.d/002_auth.sql:ro
      - ./backend/migrations/003_knowledge_graph.sql:/docker-entrypoint-initdb.d/003_knowledge_graph.sql:ro
      - ./backend/migrations/004_knowledge_auto_attach.sql:/docker-entrypoint-initdb.d/004_knowledge_auto_attach.sql:ro
      - ./backend/migrations/005_knowledge_relationship_provenance.sql:/docker-entrypoint-initdb.d/005_knowledge_relationship_provenance.sql:ro
      - ./backend/migrations/003_trip_chat.sql:/docker-entrypoint-initdb.d/003_trip_chat.sql:ro
      - ./backend/migrations/006_place_checker_catalog.sql:/docker-entrypoint-initdb.d/006_place_checker_catalog.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelplanner -d travelplanner"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LANGFUSE_DB_USER:-langfuse}
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD:-langfuse_password}
      POSTGRES_DB: ${LANGFUSE_DB_NAME:-langfuse}
    ports:
      - "${LANGFUSE_DB_PORT:-5433}:5432"
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LANGFUSE_DB_USER:-langfuse} -d ${LANGFUSE_DB_NAME:-langfuse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse:
    image: langfuse/langfuse:2.95.11
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "${LANGFUSE_PORT:-3005}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${LANGFUSE_DB_USER:-langfuse}:${LANGFUSE_DB_PASSWORD:-langfuse_password}@langfuse-db:5432/${LANGFUSE_DB_NAME:-langfuse}
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3005}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-travelplanner_langfuse_secret_key_local}
      SALT: ${LANGFUSE_SALT:-travelplanner_langfuse_salt_local}
      TELEMETRY_ENABLED: "false"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      PYTHONPATH: /app/src
      DATABASE_URL: postgresql://travelplanner:travelplanner@postgres:5432/travelplanner
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      TAVILY_SEARCH_DEPTH: ${TAVILY_SEARCH_DEPTH:-basic}
      TAVILY_MAX_RESULTS: ${TAVILY_MAX_RESULTS:-5}
      TAVILY_TIMEOUT_SECONDS: ${TAVILY_TIMEOUT_SECONDS:-15}
      INFORMATION_FINDER_EMBEDDING_MODEL: ${INFORMATION_FINDER_EMBEDDING_MODEL:-gemini-embedding-001}
      INFORMATION_FINDER_EMBEDDING_REVISION: ${INFORMATION_FINDER_EMBEDDING_REVISION:-}
      INFORMATION_FINDER_EMBEDDING_OUTPUT_DIMENSIONS: ${INFORMATION_FINDER_EMBEDDING_OUTPUT_DIMENSIONS:-384}
      INFORMATION_FINDER_EMBEDDING_TIMEOUT_SECONDS: ${INFORMATION_FINDER_EMBEDDING_TIMEOUT_SECONDS:-30}
      INFORMATION_FINDER_ANSWER_PROVIDER: ${INFORMATION_FINDER_ANSWER_PROVIDER:-gemini}
      INFORMATION_FINDER_LLM_MAX_OUTPUT_TOKENS: ${INFORMATION_FINDER_LLM_MAX_OUTPUT_TOKENS:-800}
      INFORMATION_FINDER_LLM_MAX_CHARS_PER_SOURCE: ${INFORMATION_FINDER_LLM_MAX_CHARS_PER_SOURCE:-4000}
      INFORMATION_FINDER_LLM_MAX_TOTAL_SOURCE_CHARS: ${INFORMATION_FINDER_LLM_MAX_TOTAL_SOURCE_CHARS:-12000}
      INFORMATION_FINDER_LLM_FALLBACK_ENABLED: ${INFORMATION_FINDER_LLM_FALLBACK_ENABLED:-true}
      LANGFUSE_HOST: http://langfuse:3000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    environment:
      tile_urls: https://download.geofabrik.de/asia/vietnam-latest.osm.pbf
      force_rebuild: "false"
      server_threads: "2"
      build_admins: "true"
      build_time_zones: "true"
    ports:
      - "8002:8002"
    volumes:
      - ./routing-data/valhalla:/custom_files
    restart: unless-stopped

  opentripplanner:
    image: docker.io/opentripplanner/opentripplanner:2.9.0
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        if [ ! -s /var/opentripplanner/graph.obj ]; then
          if find /var/opentripplanner -maxdepth 1 -type f -name '*.osm.pbf' -print -quit | grep -q . \
            && find /var/opentripplanner -maxdepth 1 -type f -iname '*gtfs*.zip' -print -quit | grep -q .; then
            echo "OTP graph.obj is missing; building it from the mounted OSM and GTFS inputs..."
            /docker-entrypoint.sh --build --save
          else
            echo "OTP data is not prepared; keeping the container alive. See routing-data/README.md."
            exec tail -f /dev/null
          fi
        fi
        exec /docker-entrypoint.sh --load --serve
    environment:
      JAVA_TOOL_OPTIONS: -Xmx2500m
    ports:
      - "8080:8080"
    volumes:
      - ./routing-data/opentripplanner:/var/opentripplanner
    restart: unless-stopped

volumes:
  travelplanner_postgres_data_v2:
  langfuse_postgres_data:
