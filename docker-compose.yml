services:
  postgres:
    # Existing development volumes may still contain the experimental
    # `places.embedding` vector column. Keep a pgvector-capable PostgreSQL
    # image so those volumes remain readable after the feature-code revert.
    image: pgvector/pgvector:0.8.2-pg16
    environment:
      POSTGRES_DB: vsf_travel
      POSTGRES_USER: vsf
      POSTGRES_PASSWORD: vsf
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vsf -d vsf_travel"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://vsf:vsf@postgres:5432/vsf_travel
      BACKEND_CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      APP_ENV: local
      GEMINI_MIN_INTERVAL_SECONDS: "0.0"
      PLACE_RESOLVER_PROVIDER: google_maps_scraper
      ROUTE_PROVIDER: valhalla
      VALHALLA_BASE_URL: http://valhalla:8002
      OPENTRIPPLANNER_BASE_URL: http://opentripplanner:8080/otp/gtfs/v1
      OPENTRIPPLANNER_SCHEDULE_STATUS: development_shifted_2018
      GOOGLE_MAPS_SCRAPER_EXECUTABLE: ""
      GOOGLE_MAPS_SCRAPER_WORK_DIR: /app/var/google-maps-scraper
      GOOGLE_MAPS_SCRAPER_MAX_ALIAS_QUERIES: "2"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/var:/app/var
      - ./database/golden_dataset:/database/golden_dataset:ro
    depends_on:
      postgres:
        condition: service_healthy
      google-maps-scraper:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  google-maps-scraper:
    build:
      context: ./backend
      dockerfile: Dockerfile.playwright
    environment:
      DISABLE_TELEMETRY: "1"
      GOOGLE_MAPS_SCRAPER_WORK_DIR: /work
      GOOGLE_MAPS_SCRAPER_CONCURRENCY: "2"
      GOOGLE_MAPS_SCRAPER_STALE_ARTIFACT_SECONDS: "600"
    volumes:
      - ./backend/var/google-maps-scraper:/work
    restart: unless-stopped

  valhalla:
    profiles: ["routing"]
    image: ghcr.io/valhalla/valhalla-scripted:latest
    environment:
      tile_urls: https://download.geofabrik.de/asia/vietnam-latest.osm.pbf
      force_rebuild: "false"
      server_threads: "2"
      build_admins: "true"
      build_time_zones: "true"
    ports:
      - "8002:8002"
    volumes:
      - ./routing-data/valhalla:/custom_files

  opentripplanner:
    profiles: ["routing"]
    image: docker.io/opentripplanner/opentripplanner:2.9.0
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        if [ ! -s /var/opentripplanner/graph.obj ]; then
          echo "OTP graph.obj is missing; building it from the mounted OSM and GTFS inputs..."
          /docker-entrypoint.sh --build --save
        fi
        exec /docker-entrypoint.sh --load --serve
    environment:
      JAVA_TOOL_OPTIONS: -Xmx2500m
    ports:
      - "8080:8080"
    volumes:
      - ./routing-data/opentripplanner:/var/opentripplanner

volumes:
  postgres_data:
