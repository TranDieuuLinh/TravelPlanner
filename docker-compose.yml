services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vsf_travel
      POSTGRES_USER: vsf
      POSTGRES_PASSWORD: vsf
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vsf -d vsf_travel"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://vsf:vsf@postgres:5432/vsf_travel
      BACKEND_CORS_ORIGINS: http://localhost:3000
      APP_ENV: local
      PLACE_RESOLVER_PROVIDER: nominatim
      NOMINATIM_BASE_URL: https://nominatim.openstreetmap.org
      NOMINATIM_USER_AGENT: VSF-Travel-Planner/0.1 (local-development)
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
