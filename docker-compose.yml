services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vsf_travel
      POSTGRES_USER: vsf
      POSTGRES_PASSWORD: vsf
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vsf -d vsf_travel"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://vsf:vsf@postgres:5432/vsf_travel
      BACKEND_CORS_ORIGINS: http://localhost:3000
      APP_ENV: local
      PLACE_RESOLVER_PROVIDER: nominatim
      GEMINI_MIN_INTERVAL_SECONDS: "0.0"
      NOMINATIM_BASE_URL: https://nominatim.openstreetmap.org
      NOMINATIM_USER_AGENT: VSF-Travel-Planner/0.1 (local-development)
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres_data:
